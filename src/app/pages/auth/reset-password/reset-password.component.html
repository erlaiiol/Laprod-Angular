<div class="login-wrapper">
  <div class="login-card simple-card">

    <h2>Nouveau mot de passe</h2>

    @if (done()) {
      <p class="resend-ok"><i class="bi bi-check-circle"></i> Mot de passe mis à jour.</p>
      <a routerLink="/login" class="btn-primary">Se connecter</a>
    } @else if (expired()) {
      <div class="alert-box alert-danger">{{ error() }}</div>
      <a routerLink="/forgot-password" class="btn-primary">Demander un nouveau lien</a>
    } @else {
      @if (error()) {
        <div class="alert-box alert-danger">{{ error() }}</div>
      }

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="field-group">
          <label for="password">Nouveau mot de passe</label>
          <div class="pwd-field">
            <input #pwd type="password" id="password" name="password" autocomplete="new-password" autofocus required
                   [(ngModel)]="password" />
            <button type="button" class="pwd-toggle"
                    [attr.aria-label]="pwd.type === 'password' ? 'Afficher le mot de passe' : 'Masquer le mot de passe'"
                    (click)="pwd.type = pwd.type === 'password' ? 'text' : 'password'">
              <i class="bi" [class.bi-eye]="pwd.type === 'password'" [class.bi-eye-slash]="pwd.type !== 'password'"></i>
            </button>
          </div>
          <small class="hint">9 caractères minimum, avec une minuscule, une majuscule et un chiffre.</small>
        </div>

        <div class="field-group">
          <label for="passwordConfirm">Confirmer le mot de passe</label>
          <div class="pwd-field">
            <input #pwdConfirm type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" required
                   [(ngModel)]="passwordConfirm" />
            <button type="button" class="pwd-toggle"
                    [attr.aria-label]="pwdConfirm.type === 'password' ? 'Afficher le mot de passe' : 'Masquer le mot de passe'"
                    (click)="pwdConfirm.type = pwdConfirm.type === 'password' ? 'text' : 'password'">
              <i class="bi" [class.bi-eye]="pwdConfirm.type === 'password'" [class.bi-eye-slash]="pwdConfirm.type !== 'password'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading() || !password || !passwordConfirm">
          @if (loading()) { <span class="spinner"></span> Enregistrement… }
          @else { Enregistrer }
        </button>
      </form>
    }

  </div>
</div>
