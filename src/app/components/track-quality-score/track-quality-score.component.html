@if (compact()) {

  <!-- Mode compact : anneau seul (dashboard track row) -->
  <div class="quality-score quality-score--compact" [attr.data-level]="level()" [title]="'Score qualité : ' + score() + '/100 — ' + levelLabel()">
    <svg viewBox="0 0 100 100" width="44" height="44">
      <circle class="ring-bg" cx="50" cy="50" [attr.r]="ringR" fill="none" stroke-width="12"/>
      <circle class="ring-fill" cx="50" cy="50" [attr.r]="ringR"
              fill="none" stroke-width="12" stroke-linecap="round"
              transform="rotate(-90 50 50)"
              [attr.stroke-dasharray]="ringDash()"
              [attr.stroke-dashoffset]="0"/>
    </svg>
    <span class="compact-score">{{ score() }}</span>
  </div>

} @else {

  <!-- Mode complet : anneau + badge + critères -->
  <div class="quality-score" [attr.data-level]="level()">

    <div class="quality-ring">
      <svg viewBox="0 0 100 100" width="100" height="100">
        <circle class="ring-bg" cx="50" cy="50" [attr.r]="ringR" fill="none" stroke-width="10"/>
        <circle class="ring-fill" cx="50" cy="50" [attr.r]="ringR"
                fill="none" stroke-width="10" stroke-linecap="round"
                transform="rotate(-90 50 50)"
                [attr.stroke-dasharray]="ringDash()"
                [attr.stroke-dashoffset]="0"/>
      </svg>
      <div class="ring-label">
        <span class="ring-score">{{ score() }}</span>
        <span class="ring-max">/100</span>
      </div>
    </div>

    <div class="quality-level-badge">{{ levelLabel() }}</div>

    <ul class="criteria-list">
      @for (c of criteria(); track c.label) {
        <li class="criteria-item" [class.met]="c.met">
          <i class="bi" [class.bi-check-circle-fill]="c.met" [class.bi-circle]="!c.met"></i>
          <span class="criteria-label">{{ c.label }}</span>
          <span class="criteria-points">{{ c.points }}pts</span>
          @if (!c.met) {
            <span class="criteria-tip">{{ c.tip }}</span>
          }
        </li>
      }
    </ul>

  </div>

}
