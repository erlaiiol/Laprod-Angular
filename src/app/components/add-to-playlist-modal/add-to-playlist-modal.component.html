<div class="modal-backdrop" (click)="close()">
  <div class="modal modal--playlist" (click)="$event.stopPropagation()">

    <button class="btn-icon-close" (click)="close()">
      <i class="bi bi-x-lg"></i>
    </button>

    <h3><i class="bi bi-collection-play"></i> Ajouter à une playlist</h3>

    @if (loading()) {
      <div class="modal-loading">
        <i class="bi bi-arrow-repeat spin"></i>
      </div>
    } @else {

      <!-- Liste des playlists avec état en attente -->
      <div class="pl-list">
        @for (pl of playlists(); track pl.id) {
          <label class="pl-check-row"
                 [class.pl-check-row--added]="pendingIds().has(pl.id) && !initialIds().has(pl.id)"
                 [class.pl-check-row--removed]="!pendingIds().has(pl.id) && initialIds().has(pl.id)">
            <input type="checkbox"
                   [checked]="pendingIds().has(pl.id)"
                   (change)="togglePending(pl)">
            <img loading="lazy" decoding="async" class="pl-thumb" [src]="imgUrl(pl.image_thumb ?? pl.image_file)"
                 [appImgFallback]="'assets/placeholders/placeholder-track.png'" alt="">
            <span class="pl-row-title">{{ pl.title }}</span>
            <small class="pl-track-count">{{ pl.track_count }} track(s)</small>
          </label>
        }

        @if (playlists().length === 0) {
          <p class="pl-empty">Aucune playlist. Créez-en une ci-dessous.</p>
        }
      </div>

      <!-- Créer une nouvelle playlist (avec image) -->
      @if (!showCreate()) {
        <button class="btn-secondary btn-sm" (click)="showCreate.set(true)">
          <i class="bi bi-plus"></i> Nouvelle playlist
        </button>
      } @else {
        <div class="create-form-row">
          <label class="create-img-mini" [class.has-image]="newImagePreview()">
            @if (newImagePreview()) {
              <img loading="lazy" decoding="async" [src]="newImagePreview()" alt="aperçu">
            } @else {
              <i class="bi bi-camera-fill"></i>
            }
            <input type="file" accept="image/*" (change)="onCreateImageSelected($event)">
          </label>
          <div class="create-fields-col">
            <input [(ngModel)]="newTitle"
                   placeholder="Titre de la playlist"
                   maxlength="200"
                   (keydown.enter)="createAndAdd()">
            <div class="create-actions-row">
              <button class="btn-primary btn-sm"
                      (click)="createAndAdd()"
                      [disabled]="!newTitle().trim() || creating()">
                @if (creating()) { <i class="bi bi-arrow-repeat spin"></i> } @else { Créer }
              </button>
              <button class="btn-ghost btn-sm" (click)="showCreate.set(false)">Annuler</button>
            </div>
          </div>
        </div>
      }

      <!-- Footer : sauvegarder -->
      <div class="modal-footer">
        <button class="btn-primary btn-sm"
                (click)="saveChanges()"
                [disabled]="!hasPendingChanges() || saving()">
          @if (saving()) {
            <i class="bi bi-arrow-repeat spin"></i> Sauvegarde…
          } @else {
            <i class="bi bi-check-lg"></i> Sauvegarder
          }
        </button>
        <button class="btn-ghost btn-sm" (click)="close()">Fermer</button>
      </div>

    }
  </div>
</div>
