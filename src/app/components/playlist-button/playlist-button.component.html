@if (track.playlist_count > 0) {
  <button class="playlist-btn"
          [title]="track.playlist_count + ' playlist(s)'"
          (click)="goToPlaylists($event)">
    <div class="pl-stack">
      @if (track.playlist_count >= 3) { <div class="pl-ghost pl-ghost--3"></div> }
      @if (track.playlist_count >= 2) { <div class="pl-ghost pl-ghost--2"></div> }
      <img class="pl-cover"
           [src]="coverUrl()"
           onerror="this.src='assets/placeholders/placeholder-track.png'"
           alt="">
    </div>
    @if (track.playlist_count >= 3) {
      <span class="pl-count">+{{ track.playlist_count }}</span>
    }
  </button>
}
