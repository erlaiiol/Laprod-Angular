<app-toast></app-toast>
<app-upload-progress-toast></app-upload-progress-toast>
<app-topline-progress-toast></app-topline-progress-toast>
@if (!player.studioOpen()) {
  <app-mix-sample-banner></app-mix-sample-banner>
  <app-navbar></app-navbar>
}
<main class="main-content">
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>
@if (!player.studioOpen()) {
  <app-player></app-player>
}
<!-- Widgets non critiques : instanciés après le premier rendu (requestIdleCallback),
     leur code sort du bundle initial. -->
@defer (on idle) {
  <app-userflow></app-userflow>
}
@defer (on idle) {
  <app-youtube-bubble></app-youtube-bubble>
}
@defer (on idle) {
  <app-sidebar-fabs></app-sidebar-fabs>
}
