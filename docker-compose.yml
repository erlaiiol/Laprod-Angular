# =============================================================================
# LaProd - Docker Compose PRODUCTION
# Stack : frontend (Angular + Nginx) + Flask (Gunicorn) + PostgreSQL + Redis + Certbot
#
# Prérequis :
#   - Copier .env.example → .env et remplir les variables
#   - Lancer ng build avant le premier déploiement (ou laisser Dockerfile.frontend le faire)
#
# Premier démarrage :
#   docker compose -f docker-compose.yml up -d --build
#
# Mise à jour complète (backend + frontend) :
#   git pull && docker compose -f docker-compose.yml up -d --build
#
# Mise à jour frontend UNIQUEMENT (sans toucher au backend) :
#   git pull && ./scripts/deploy-frontend.sh
#   OU manuellement :
#   docker compose -f docker-compose.yml build frontend
#   docker compose -f docker-compose.yml up -d --no-deps --force-recreate frontend
#
# Logs :
#   docker compose logs -f
#   docker compose logs -f web
#
# IMPORTANT : toujours utiliser -f docker-compose.yml sur le serveur pour
# ignorer docker-compose.override.yml (réservé au développement local).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    env_file: .env
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laprod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Redis — stockage refresh tokens JWT + cache OAuth
  # Pas de port exposé en prod (accès interne uniquement)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - laprod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  # ---------------------------------------------------------------------------
  # Flask / Gunicorn (API uniquement — plus de Jinja en prod)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      FLASK_ENV:    production
      FLASK_APP:    app.py
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL:    redis://redis:6379/0   # pour flask_limiter (module-level)
      REDIS_HOST:   redis                 # pour redis_client (init_extensions)
      REDIS_PORT:   "6379"
      REDIS_DB:     "0"
    volumes:
      - ./db_assets:/usr/src/app/db_assets    # uploads persistants
      - ./logs:/usr/src/app/logs
    networks:
      - laprod
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "--max-time", "3", "http://localhost:5000/api/auth/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }

  # ---------------------------------------------------------------------------
  # RQ Worker — traitement asynchrone des beats (watermark, image, DB)
  # Utilise le même Dockerfile que web, commande différente.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    entrypoint: []   # bypass entrypoint.sh (migrations/admin inutiles pour le worker)
    command: ["gosu", "appuser", "uv", "run", "rq", "worker", "--url", "redis://redis:6379/0"]
    env_file: .env
    environment:
      FLASK_ENV:    production
      FLASK_APP:    app.py
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL:    redis://redis:6379/0
      REDIS_HOST:   redis
      REDIS_PORT:   "6379"
      REDIS_DB:     "0"
    volumes:
      - ./db_assets:/usr/src/app/db_assets
      - ./logs:/usr/src/app/logs
    networks:
      - laprod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Frontend : Angular (build) + Nginx (reverse proxy + SPA)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./db_assets:/usr/src/app/db_assets:ro  # fichiers statiques Flask (images, audio)
      - certbot_www:/var/www/certbot:ro        # challenge Let's Encrypt
      - certbot_conf:/etc/letsencrypt:ro       # certificats SSL
    networks:
      - laprod
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Certbot — Let's Encrypt (déclenché manuellement)
  #
  # Premier certificat :
  #   docker compose -f docker-compose.yml run --rm certbot certonly --webroot \
  #     --webroot-path=/var/www/certbot \
  #     -d laprod.net -d www.laprod.net \
  #     --email contact@laprod.net --agree-tos --no-eff-email
  #
  # Renouvellement (cron Ubuntu) :
  #   0 3 * * 1 docker compose -f docker-compose.yml run --rm certbot renew \
  #             && docker compose -f docker-compose.yml exec frontend nginx -s reload
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - laprod
    profiles:
      - certbot

# -----------------------------------------------------------------------------
# Volumes persistants
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:

# -----------------------------------------------------------------------------
# Réseau nommé explicite
# Sans ce réseau nommé, Docker Compose utilise {projet}_default et peut le
# recréer lors de rebuilds partiels (--build frontend), ce qui déconnecte tous
# les services pendant quelques secondes.
# Un réseau nommé persist indépendamment du cycle de vie des containers.
# -----------------------------------------------------------------------------
networks:
  laprod:
    driver: bridge
