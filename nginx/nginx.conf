# =============================================================================
# Nginx — LaProd Production
# Architecture : Angular SPA (statique) + Flask API (proxy)
#
# Routes Flask proxiées : /api/ (tous les blueprints JSON), /static/, /legacy/
# Routes Angular (SPA fallback) : tout le reste
# Fichiers statiques Flask (/static/) : servis directement par nginx
# =============================================================================

# Résolution DNS Docker dynamique — obligatoire pour les rebuilds partiels.
# Sans resolver explicite, nginx résout web:5000 une seule fois au démarrage ;
# si Docker DNS n'est pas encore prêt, le backend est déclaré down définitivement.
# 127.0.0.11 = DNS embarqué Docker (toujours présent dans les containers).
resolver 127.0.0.11 valid=5s ipv6=off;

# ── Rate limiting L7 (anti-DDoS applicatif) ──────────────────────────────────
# L'anti-DDoS OVH (VAC) ne filtre que le volumétrique L3/L4 : il ne déchiffre pas
# le TLS et ne voit donc jamais un flood HTTP applicatif. Ce filtrage-là nous
# incombe entièrement, et il doit vivre ICI, pas seulement dans Flask-Limiter :
# une requête rejetée par Flask a déjà consommé un worker gunicorn, une connexion
# Redis et une connexion PostgreSQL. Rejetée par nginx, elle ne coûte rien.
#
# $binary_remote_addr = IP client réelle (les ports 80/443 sont publiés en direct,
# Docker préserve l'IP source via DNAT). 10m ≈ 160 000 IP suivies par zone.
#
# Débits : calibrés pour être invisibles en usage normal, admin panel inclus
# (un humain ne tient pas 20 req/s en continu ; les rafales sont absorbées par
# `burst` + `nodelay`, qui sert immédiatement le pic au lieu de l'étaler).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# 429 (et non 503 par défaut) : cohérent avec le handler Flask-Limiter d'app.py,
# et c'est le code qu'attend le front.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ── Détection bots sociaux (Open Graph crawlers) ──────────────────────────────
# Si le User-Agent correspond à un crawler connu, $is_bot = 1.
# Le bloc location / redirige alors vers Flask /og-preview/<path>.
map $http_user_agent $is_bot {
    default                                                           0;
    ~*(facebookexternalhit|facebot|Facebot)                          1;
    ~*(Twitterbot|twitter\.com)                                       1;
    ~*(LinkedInBot|linkedinbot)                                       1;
    ~*(WhatsApp|Viber|Telegram)                                       1;
    ~*(Slackbot|slack\.com)                                           1;
    ~*(Discordbot|discordapp\.com)                                    1;
    ~*(Pinterest|PinterestBot)                                        1;
    ~*(GoogleBot|google\.com\/bot)                                    1;
    ~*(bingbot|BingPreview)                                           1;
    ~*(ia_archiver|Embedly|Quora|Showyoubot|Outbrain)                 1;
    ~*(vkShare|W3C_Validator|redditbot|Applebot|SkypeUriPreview)      1;
    ~*(nuzzel|Mediapartners-Google|AhrefsBot|SemrushBot)              1;
}


# ---------------------------------------------------------------------------
# Catch-all : rejette silencieusement l'accès par IP brute et les vhosts inconnus
# Doit être déclaré AVANT les server blocks nommés.
# ---------------------------------------------------------------------------
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/laprod.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laprod.net/privkey.pem;

    return 444;
}

# ---------------------------------------------------------------------------
# Serveur HTTP → redirection HTTPS (+ challenge Let's Encrypt)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name laprod.net www.laprod.net;

    # Challenge ACME Certbot (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Serveur HTTPS principal
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name laprod.net www.laprod.net;

    # ── SSL ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/laprod.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laprod.net/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Headers de sécurité ─────────────────────────────────────────────────
    # CSP du SPA Angular (index.html servi par nginx). La CSP Flask/Talisman ne
    # couvre QUE les réponses Flask ; sans celle-ci, le document principal du SPA
    # n'avait aucune protection XSS. Calquée sur la CSP Talisman (extensions.py).
    # Build Angular prod = pas d'eval ; 'unsafe-inline' limité aux styles.
    set $csp "default-src 'self'; script-src 'self' https://js.stripe.com https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://api.stripe.com https://challenges.cloudflare.com; frame-src https://js.stripe.com https://challenges.cloudflare.com; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'";
    # Les 5 headers vivent dans un snippet : indispensable car chaque bloc
    # `location` qui pose son propre add_header (cache, Range…) doit le ré-inclure,
    # sinon nginx efface les headers hérités (nosniff compris). Voir le snippet.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Limites ─────────────────────────────────────────────────────────────
    # Défaut restrictif : seul le proxy Flask (snippets/proxy-flask.conf) relève
    # cette valeur à 900M pour les uploads. Auparavant global, ce plafond laissait
    # n'importe qui pousser 900 MB sur n'importe quelle URL, y compris statique.
    client_max_body_size 1m;

    # Anti-slowloris : plafonne le temps entre deux lectures socket, côté requête.
    # Volontairement pas de `send_timeout` ici — un lecteur audio en pause cesse de
    # consommer la réponse pendant de longues secondes, on ne veut pas couper.
    client_header_timeout 15s;
    client_body_timeout   30s;

    # Plafond de connexions simultanées par IP. Large : HTTP/2 multiplexe, mais un
    # navigateur peut ouvrir plusieurs connexions (audio + assets + onglets).
    limit_conn conn_per_ip 30;

    # ── Compression ──────────────────────────────────────────────────────────
    # L'image nginx officielle ne l'active pas : sans ce bloc, JS/CSS/JSON
    # partent en clair (main.js 149 kB au lieu de ~33 kB gzippés).
    # gzip_proxied any : compresse aussi les réponses JSON de l'API Flask.
    # Pas de woff2/images dans gzip_types : déjà compressés nativement.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # ── Root Angular — hérité par tous les blocs location sans root propre ──
    root /usr/share/nginx/html;

    # ── Assets PUBLICS uniquement (images de couverture, avatars, marketing, fonts) ──
    # SÉCURITÉ : ne desservir publiquement QUE les sous-dossiers non sensibles.
    # Le match de préfixe le plus long l'emporte : ces blocs spécifiques captent
    # /db_assets/images|main|fonts, et le catch-all /db_assets/ ci-dessous renvoie
    # 404 pour tout le reste (audio complet, stems, contrats, factures, mixmaster).
    # Ces contenus sensibles ne sont servis QUE via /_protected/ après auth Flask.
    location ^~ /db_assets/images/ {
        alias /usr/src/app/db_assets/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;  # nosniff sur les images uploadées
        access_log off;
    }
    location ^~ /db_assets/main/ {
        alias /usr/src/app/db_assets/main/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }
    location ^~ /db_assets/fonts/ {
        alias /usr/src/app/db_assets/fonts/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }
    # Catch-all : tout autre /db_assets/... (audio, contracts, invoices, mixmaster)
    # est refusé en accès direct.
    location ^~ /db_assets/ {
        return 404;
    }

    # ── Fichiers audio/contrats protégés — servis par nginx après auth Flask ──
    # internal : inaccessible directement depuis le navigateur.
    # Activé par le header X-Accel-Redirect que Flask retourne après avoir
    # vérifié le JWT et les droits. Le worker Gunicorn est libéré immédiatement.
    location ^~ /_protected/ {
        internal;
        alias /usr/src/app/db_assets/;
        add_header Accept-Ranges bytes;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── API Flask — routes proxiées ─────────────────────────────────────────
    # Toutes les routes API sont sous /api/. Le reste va au SPA Angular.
    #
    # Deux locations, deux politiques de débit. `^~` (préfixe prioritaire) garantit
    # que /api/auth/ est évalué AVANT la regex générale ci-dessous.

    # Surface d'attaque credentials (login, register, reset, refresh) : on veut un
    # débit bas. Flask-Limiter y applique déjà des quotas métier (10/min sur login) ;
    # nginx est la barrière qui empêche ces requêtes d'atteindre Python.
    # burst=20 : couvre le refresh JWT d'un SPA qui rouvre plusieurs onglets.
    location ^~ /api/auth/ {
        limit_req  zone=api_auth burst=20 nodelay;
        limit_conn conn_per_ip 20;   # plus strict que le défaut server (30) sur l'auth
        include /etc/nginx/snippets/proxy-flask.conf;
    }

    # Reste de l'API (dont /api/admin/ : 20 r/s soutenus + 40 en rafale, un panel
    # admin qui charge ses listes et enchaîne les actions reste très loin du seuil).
    # limit_conn : hérite du défaut server (conn_per_ip 30).
    location ~ ^/(api|legacy)(/|$) {
        limit_req  zone=api_general burst=40 nodelay;
        include /etc/nginx/snippets/proxy-flask.conf;
    }

    # ── Angular SPA ─────────────────────────────────────────────────────────
    # Pour les bots sociaux (Instagram, WhatsApp, etc.) : proxy vers Flask
    # qui renvoie un HTML minimal avec les bonnes balises Open Graph.
    # Pour les vrais utilisateurs : SPA Angular via try_files.
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # Bots → Flask OG preview (HTML statique avec meta og:*)
        if ($is_bot) {
            set $flask_upstream "http://web:5000";
            rewrite ^/(.*)$ /og-preview/$1 break;
            proxy_pass $flask_upstream;
        }

        try_files $uri /index.html;
    }
    
    # Cache agressif pour les assets hashés Angular (bundle.xxx.js)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;  # nosniff sur JS/CSS/SVG
        access_log off;
    }

    # Pas de cache pour index.html (doit toujours être à jour)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # nginx abandonne les add_header hérités dès qu'un bloc en définit un :
        # on redéclare donc les headers de sécurité (CSP incluse) via le snippet.
        include /etc/nginx/snippets/security-headers.conf;
    }
}
