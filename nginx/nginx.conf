# =============================================================================
# Nginx — LaProd Production
# Architecture : Angular SPA (statique) + Flask API (proxy)
#
# Routes Flask proxiées : /api/ (tous les blueprints JSON), /static/, /legacy/
# Routes Angular (SPA fallback) : tout le reste
# Fichiers statiques Flask (/static/) : servis directement par nginx
# =============================================================================

# Résolution DNS Docker dynamique — obligatoire pour les rebuilds partiels.
# Sans resolver explicite, nginx résout web:5000 une seule fois au démarrage ;
# si Docker DNS n'est pas encore prêt, le backend est déclaré down définitivement.
# 127.0.0.11 = DNS embarqué Docker (toujours présent dans les containers).
resolver 127.0.0.11 valid=5s ipv6=off;

# ── Détection bots sociaux (Open Graph crawlers) ──────────────────────────────
# Si le User-Agent correspond à un crawler connu, $is_bot = 1.
# Le bloc location / redirige alors vers Flask /og-preview/<path>.
map $http_user_agent $is_bot {
    default                                                           0;
    ~*(facebookexternalhit|facebot|Facebot)                          1;
    ~*(Twitterbot|twitter\.com)                                       1;
    ~*(LinkedInBot|linkedinbot)                                       1;
    ~*(WhatsApp|Viber|Telegram)                                       1;
    ~*(Slackbot|slack\.com)                                           1;
    ~*(Discordbot|discordapp\.com)                                    1;
    ~*(Pinterest|PinterestBot)                                        1;
    ~*(GoogleBot|google\.com\/bot)                                    1;
    ~*(bingbot|BingPreview)                                           1;
    ~*(ia_archiver|Embedly|Quora|Showyoubot|Outbrain)                 1;
    ~*(vkShare|W3C_Validator|redditbot|Applebot|SkypeUriPreview)      1;
    ~*(nuzzel|Mediapartners-Google|AhrefsBot|SemrushBot)              1;
}

# ---------------------------------------------------------------------------
# Catch-all : rejette silencieusement l'accès par IP brute et les vhosts inconnus
# Doit être déclaré AVANT les server blocks nommés.
# ---------------------------------------------------------------------------
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/laprod.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laprod.net/privkey.pem;

    return 444;
}

# ---------------------------------------------------------------------------
# Serveur HTTP → redirection HTTPS (+ challenge Let's Encrypt)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name laprod.net www.laprod.net;

    # Challenge ACME Certbot (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Serveur HTTPS principal
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name laprod.net www.laprod.net;

    # ── SSL ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/laprod.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laprod.net/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Headers de sécurité ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── Limites ─────────────────────────────────────────────────────────────
    client_max_body_size 900M;   # uploads audio / stems (archives jusqu'à 800 MB)

    # ── Root Angular — hérité par tous les blocs location sans root propre ──
    root /usr/share/nginx/html;

    # ── Fichiers statiques Flask (images, audio non-streamé, etc.) ──────────
    # ^~ : empêche les regex (*.png, *.mp3...) du bas de la config de prendre la priorité
    location ^~ /db_assets/ {
        alias /usr/src/app/db_assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers audio/contrats protégés — servis par nginx après auth Flask ──
    # internal : inaccessible directement depuis le navigateur.
    # Activé par le header X-Accel-Redirect que Flask retourne après avoir
    # vérifié le JWT et les droits. Le worker Gunicorn est libéré immédiatement.
    location ^~ /_protected/ {
        internal;
        alias /usr/src/app/db_assets/;
        add_header Accept-Ranges bytes;
    }

    # ── API Flask — routes proxiées ─────────────────────────────────────────
    # Toutes les routes API sont sous /api/. Le reste va au SPA Angular.
    # La variable $flask_upstream force nginx à passer par le resolver à chaque
    # requête → résolution DNS dynamique, résiliente aux rebuilds partiels.
    location ~ ^/(api|legacy)(/|$) {
        set $flask_upstream "http://web:5000";
        proxy_pass         $flask_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Court délai de connexion initiale : si web est down, nginx échoue vite
        # et renvoie 502 immédiatement plutôt que de bloquer la connexion.
        proxy_connect_timeout  3s;
        # Timeout élevé pour les uploads audio longs (archives stems > 500 MB)
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;

        # Support streaming audio (Range requests)
        proxy_buffering off;
    }

    # ── Angular SPA ─────────────────────────────────────────────────────────
    # Pour les bots sociaux (Instagram, WhatsApp, etc.) : proxy vers Flask
    # qui renvoie un HTML minimal avec les bonnes balises Open Graph.
    # Pour les vrais utilisateurs : SPA Angular via try_files.
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # Bots → Flask OG preview (HTML statique avec meta og:*)
        if ($is_bot) {
            set $flask_upstream "http://web:5000";
            rewrite ^/(.*)$ /og-preview/$1 break;
            proxy_pass $flask_upstream;
        }

        try_files $uri /index.html;
    }
    
    # Cache agressif pour les assets hashés Angular (bundle.xxx.js)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pas de cache pour index.html (doit toujours être à jour)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
