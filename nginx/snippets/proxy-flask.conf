# =============================================================================
# Proxy vers Flask/Gunicorn — snippet réutilisable
#
# Factorisé car deux locations proxient vers Flask avec des politiques de
# rate-limiting différentes (/api/auth/ plus strict que le reste de /api/).
# Sans ce snippet, la moindre divergence entre les deux blocs (timeout, header
# X-Forwarded-For…) passerait inaperçue.
#
# Prérequis : la location appelante définit sa propre directive limit_req.
# =============================================================================

# La variable force nginx à repasser par le resolver à chaque requête →
# résolution DNS dynamique, résiliente aux rebuilds partiels du service web.
set $flask_upstream "http://web:5000";
proxy_pass         $flask_upstream;
proxy_http_version 1.1;
proxy_set_header   Connection      "";
proxy_set_header   Host            $host;
proxy_set_header   X-Real-IP       $remote_addr;
proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# Uploads audio / stems (archives jusqu'à 800 MB). Volontairement porté par le
# proxy Flask et non par le server : les locations statiques/SPA n'ont aucune
# raison d'accepter un corps de requête de 900 MB.
client_max_body_size 900M;

# Court délai de connexion initiale : si web est down, nginx échoue vite
# et renvoie 502 immédiatement plutôt que de bloquer la connexion.
proxy_connect_timeout  3s;
# Timeout élevé pour les uploads audio longs (archives stems > 500 MB)
proxy_read_timeout    600s;
proxy_send_timeout    600s;

# ── Buffering : NE PAS remettre à off ────────────────────────────────────────
# `proxy_buffering off` exposait un slow-read : nginx relayait la réponse octet
# par octet au rythme du client, gardant le worker gunicorn bloqué pendant tout
# ce temps. 5 connexions lisant à 1 o/s suffisaient à tuer l'API.
#
# Le buffering est sans effet de bord ici : en production Flask ne renvoie
# JAMAIS d'octets audio (USE_X_ACCEL_REDIRECT → nginx sert /_protected/
# lui-même). Les réponses proxiées sont des JSON de quelques Ko.
proxy_buffering on;
proxy_buffers        16 16k;
proxy_buffer_size    16k;
proxy_busy_buffers_size 32k;
