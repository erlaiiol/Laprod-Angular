# =============================================================================
# Headers de sécurité — snippet réutilisable
#
# Rappel nginx : dès qu'un bloc `location` déclare son PROPRE `add_header`
# (ex: Cache-Control, Accept-Ranges), il PERD la totalité des `add_header`
# hérités du server. Sans ce snippet, chaque bloc qui pose un header de cache
# desservait donc son contenu SANS `X-Content-Type-Options: nosniff` — dont les
# images uploadées par les utilisateurs (/db_assets/images/).
#
# Regrouper les 5 headers en un seul point supprime la cause racine : toute
# divergence future (nouveau header, oubli sur un bloc) devient impossible.
#
# Prérequis : la variable $csp doit être définie dans le server englobant.
# =============================================================================
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options           SAMEORIGIN                            always;
add_header X-Content-Type-Options    nosniff                               always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
add_header Content-Security-Policy    $csp                                  always;
