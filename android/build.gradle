// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Version alignée sur celle utilisée par les plugins Capacitor (ex. @capacitor/filesystem),
    // exposée via rootProject.ext pour que les modules Capacitor s'y alignent aussi.
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // TarsosDSP pour Android (be.tarsos.dsp.io.android.AudioDispatcherFactory) n'est plus publié
        // en artefact Maven depuis la 2.5 (voir CHANGELOG TarsosDSP) : seul le jar "fat" historique
        // TarsosDSP-Android-2.4 (qui embarque core + pitch + io.android) reste distribué, sur le
        // dépôt de releases de l'auteur. Déclaré en ivy pour éviter de committer un binaire.
        ivy {
            url = 'https://0110.be/releases/TarsosDSP/'
            patternLayout {
                artifact '[organisation]-[revision]/[module]-[revision].[ext]'
            }
            metadataSources { artifact() }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
